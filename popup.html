<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="ui.css" />
    <style>
      body { width: 360px; padding: 14px; display: grid; gap: 14px; }
      .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
      .count { font-size: 12px; margin-top: 6px; }
      .shortcut { display: flex; justify-content: space-between; align-items: center; padding: 5px 0; }
      .hist { display: grid; gap: 2px; max-height: 190px; overflow: auto; }
      .hist a.item { display: flex; justify-content: space-between; align-items: center; padding: 6px 8px; border-radius: 8px; color: var(--ink); }
      .hist a.item:hover { background: var(--soft); text-decoration: none; }
      .login { display: none; }
      .login.show { display: flex; }
      footer { display: flex; justify-content: space-between; font-size: 12px; }
    </style>
  </head>
  <body>
    <header class="row between">
      <div class="brand">
        <img src="icon48.png" alt="" />
        <h1>CultureX Quick Search</h1>
      </div>
      <span id="auth" class="pill"><span class="dot"></span><span>Checking</span></span>
    </header>

    <div id="login" class="card login row between">
      <span class="muted">Log in to Influenzer to start searching.</span>
      <button id="loginBtn">Log in</button>
    </div>

    <section>
      <div class="row between" style="margin-bottom: 8px">
        <h2 style="margin: 0">Creators</h2>
        <span id="credits" class="pill credit" hidden></span>
      </div>
      <textarea id="input" placeholder="Paste Instagram links, @handles or usernames, one per line"></textarea>
      <div id="count" class="count muted">Nothing detected yet</div>
      <div class="actions">
        <button id="searchBtn" disabled>Search</button>
        <button id="unlockBtn" class="credit" disabled title="Uses Influenzer credits">Search + unlock audience</button>
        <button id="addSheetBtn" class="ghost" disabled style="grid-column: 1 / -1">+ Add to sheet (fill later)</button>
      </div>
    </section>

    <button class="ghost" id="sheetBtn" style="width: 100%; justify-content: space-between">
      <span>📋 Open sheet</span><span id="sheetCount" class="muted" style="font-weight: 500"></span>
    </button>

    <section>
      <h2>Hotkeys</h2>
      <div id="hotkeys"></div>
      <div id="tip" class="muted" style="font-size: 12px; margin-top: 8px"></div>
    </section>

    <section id="recentWrap" hidden>
      <h2>Recent</h2>
      <div id="history" class="hist"></div>
    </section>

    <footer>
      <a id="openApp">Open Influenzer</a>
      <a id="settings">Settings</a>
    </footer>

    <script type="module" src="popup.js"></script>
  </body>
</html>
